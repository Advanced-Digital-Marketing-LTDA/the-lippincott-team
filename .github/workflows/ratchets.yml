name: Ratchets

# Free gates that stop a PR from making CI green by weakening it: more skipped tests,
# more lint/type suppressions, or more `any`. Baselines are today's counts; lower them
# as the codebase improves, never raise them. Input names follow the actions' READMEs
# (motchalini-llc/*@v1); confirm against the Marketplace pages on first run.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ratchets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: motchalini-llc/test-ratchet@v1
        with:
          language: typescript
          baseline-skip: '0'
      - uses: motchalini-llc/suppress-ratchet@v1
        with:
          language: typescript
          baseline-suppress: '0'
      - uses: motchalini-llc/type-ratchet@v1
        with:
          language: typescript
          baseline-any: '2'
          baseline-suppress: '0'
